# A ogni push su main: controllo dello stile e tutte le prove senza grafica; se passano, costruisce il gioco e lo
# pubblica su GitHub Pages. Avviato a mano si può saltare le prove (per esempio se una prova statistica sbaglia di poco)
name: Deploy su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      salta_prove:
        description: Pubblica senza fare le prove
        type: boolean
        default: false

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    if: ${{ !inputs.salta_prove }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:all

  deploy:
    needs: test
    if: ${{ always() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@v5
