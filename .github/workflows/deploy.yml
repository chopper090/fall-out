# A ogni push su main: controllo dello stile e le prove veloci senza grafica (check, sempre, anche quella che la build
# per l'uscita non abbia gli strumenti di sviluppo), e le prove statistiche lunghe con il bot (stats); se passano,
# costruisce il gioco e lo pubblica su GitHub Pages. Avviato a mano si possono saltare le sole prove statistiche (per
# esempio se una sbaglia di poco dopo un ritocco del bilanciamento): stile e prove veloci si fanno sempre
name: Deploy su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      salta_prove:
        description: Pubblica senza le prove statistiche (stile e prove veloci si fanno sempre)
        type: boolean
        default: false

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  stats:
    if: ${{ !inputs.salta_prove }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:stats

  deploy:
    needs: [check, stats]
    if: ${{ always() && needs.check.result == 'success' && (needs.stats.result == 'success' || needs.stats.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@v5
